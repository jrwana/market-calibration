# The dashboard behind Caddy. Values come from deploy/.env, which deploy.sh writes on the server
# and which is never committed:
#   APP_HOST  hostname for HTTPS (a domain, or <ip-with-dashes>.sslip.io)
#   APP_PATH  random path segment the app is served under; everything else returns 404

# Explicit, because every project on this server keeps its compose file in a folder named
# deploy/, and the default project name (the folder) would make them clean up each other.
name: market-calibration

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      STREAMLIT_SERVER_BASE_URL_PATH: ${APP_PATH:?set APP_PATH in deploy/.env}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    expose:
      - "8501"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in deploy/.env}
      APP_PATH: ${APP_PATH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Other projects on this server drop a route snippet here (see the Caddyfile's import).
      - /srv/caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    restart: unless-stopped

# Shared with other projects' compose files so Caddy can reach their containers by name.
networks:
  edge:
    name: edge

volumes:
  # Named to keep the volumes created before the project had an explicit name (and with them
  # the issued HTTPS certificate).
  caddy_data:
    name: deploy_caddy_data
  caddy_config:
    name: deploy_caddy_config
