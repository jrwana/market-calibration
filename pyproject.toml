[project]
name = "calib"
version = "0.1.0"
description = "Are Kalshi and Polymarket prices calibrated probabilities? A leak-free audit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "tenacity>=9.0",
    "pandas>=2.2",
    "duckdb>=1.1",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=17",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
llm = ["anthropic>=0.40", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.7", "mypy>=1.13", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/calib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
